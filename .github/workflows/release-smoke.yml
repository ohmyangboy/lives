name: Smoke test Lives release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        default: v0.1.0
      asset:
        description: DMG asset name
        required: true
        default: Lives_0.1.0_aarch64.dmg
      sha256:
        description: Expected DMG SHA-256
        required: true
        default: ea6dba1f4e54c55949c5afe0d0c8d994efa6f9f8cb871bcfebf068741a357d2c

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ASSET: ${{ inputs.asset }}
      RELEASE_SHA256: ${{ inputs.sha256 }}
      DOWNLOAD_DIR: ${{ runner.temp }}/lives-release
      MOUNT_DIR: ${{ runner.temp }}/lives-volume
      LIVES_SERVICE: ${{ runner.temp }}/lives-volume/Lives.app/Contents/MacOS/live-photo-service

    steps:
      - name: Checkout public smoke fixtures
        uses: actions/checkout@v7

      - name: Record stable runner
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Download published DMG
        run: |
          mkdir -p "$DOWNLOAD_DIR"
          curl --fail --location --retry 3 \
            --output "$DOWNLOAD_DIR/$RELEASE_ASSET" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$RELEASE_ASSET"

      - name: Verify published DMG
        run: |
          printf '%s  %s\n' "$RELEASE_SHA256" "$DOWNLOAD_DIR/$RELEASE_ASSET" | shasum -a 256 --check
          hdiutil verify "$DOWNLOAD_DIR/$RELEASE_ASSET"

      - name: Mount and inspect release
        run: |
          mkdir -p "$MOUNT_DIR"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "$DOWNLOAD_DIR/$RELEASE_ASSET"
          test -x "$LIVES_SERVICE"
          case "$(file "$LIVES_SERVICE")" in
            *arm64*) ;;
            *) exit 1 ;;
          esac
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/Lives.app"

      - name: Render and validate synthetic Live Photo pair
        run: python3 smoke/run_release_smoke.py

      - name: Unmount release
        if: always()
        run: hdiutil detach "$MOUNT_DIR" || true
