name: Deploy Lives website to Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build website
        env:
          LIVES_DOWNLOAD_URL: ${{ vars.LIVES_DOWNLOAD_URL || 'https://github.com/ohmyangboy/lives/releases/latest' }}
        run: npm run build

      - name: Validate public output
        run: python3 ../scripts/check_website.py dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  deploy-server:
    # 暂时保持关闭。
    # 最后配置好 SSH Secrets 后再创建仓库变量：
    # LIVES_SERVER_DEPLOY_ENABLED=true
    if: ${{ vars.LIVES_SERVER_DEPLOY_ENABLED == 'true' }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Build website for 1leaf
        working-directory: website
        env:
          LIVES_DOWNLOAD_URL: https://download.1leaf.cc/Lives-latest.dmg
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIVES_WEBSITE_SSH_KEY }}
          SERVER_HOST: ${{ secrets.LIVES_SERVER_HOST }}
          SERVER_KNOWN_HOSTS: ${{ secrets.LIVES_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          test -n "$SERVER_KNOWN_HOSTS"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy website to 1leaf
        env:
          SERVER_HOST: ${{ secrets.LIVES_SERVER_HOST }}
          SERVER_USER: ${{ secrets.LIVES_SERVER_USER }}
        run: |
          set -euo pipefail

          tar \
            -C website/dist \
            -czf - \
            . \
          | ssh \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "$SERVER_USER@$SERVER_HOST" \
              "deploy-lives-website"
