name: 功能建议
description: 描述希望 Lives 改善的使用场景
title: "[Feature] "
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有上传私人视频、照片、联系方式或其他个人信息。
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想完成什么？目前卡在哪里？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望的解决方式
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 当前替代方案
      description: 如果已经有绕行办法，请简要描述。
