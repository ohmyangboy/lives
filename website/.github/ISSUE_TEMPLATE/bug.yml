name: Bug 报告
description: 报告可复现的安装、导入、预览或导出问题
title: "[Bug] "
body:
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我从 Lives 官方 GitHub Release 下载了安装包。
          required: true
        - label: 我没有上传私人视频、照片、完整文件路径、联系方式或未经脱敏的日志。
          required: true
        - label: 我理解此 Issue 及附件将公开显示，并由 GitHub 托管。
          required: true
  - type: input
    id: version
    attributes:
      label: Lives 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac 芯片
      options:
        - Apple M1
        - Apple M2
        - Apple M3
        - Apple M4
        - 其他或不确定
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题环节
      options:
        - 下载或安装
        - 导入素材
        - 预览或编辑
        - 保存到照片
        - 导出到文件夹
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用不含私人素材名称的步骤描述问题。
      placeholder: |
        1. 打开 Lives
        2. 导入一段 MOV
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏错误信息
      description: 请移除用户名、完整路径、视频文件名、照片标识和其他私人信息。
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 复现频率
      options:
        - 每次都能复现
        - 偶尔复现
        - 只出现过一次
    validations:
      required: true
