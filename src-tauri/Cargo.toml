[package]
name = "live-collage"
version = "0.1.15"
description = "Turn one to three videos into a collage Live Photo"
authors = ["Lives"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ohmyangboy/lives"
publish = false

[lib]
name = "live_collage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
